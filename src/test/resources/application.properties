# Cau hinh danh RIENG cho test: dung H2 in-memory de test chay duoc doc lap voi MySQL.
# Database chinh cua ung dung van la MySQL (xem src/main/resources/application.properties).
spring.datasource.url=jdbc:h2:mem:cnj49test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Tat seed data trong test de test tu kiem soat du lieu
app.seed.enabled=false
spring.thymeleaf.cache=false
