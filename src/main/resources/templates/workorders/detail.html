<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title=${workOrder.workOrderCode})}"></head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <div class="d-flex justify-content-between align-items-start mb-3 flex-wrap gap-2">
            <div>
                <div class="d-flex align-items-center gap-2">
                    <h4 class="fw-bold mb-0" th:text="${workOrder.workOrderCode}"></h4>
                    <span th:replace="~{fragments/badges :: statusBadge(${workOrder.status})}"></span>
                </div>
                <div class="text-muted">
                    Từ yêu cầu <a th:href="@{/maintenance/{id}(id=${workOrder.maintenanceRequest.id})}" th:text="${workOrder.maintenanceRequest.requestCode}"></a>
                </div>
            </div>
            <div class="d-flex gap-2 flex-wrap">
                <form th:if="${workOrder.status.name() == 'NOT_STARTED'}" th:action="@{/workorders/{id}/start(id=${workOrder.id})}" method="post">
                    <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-play-fill me-1"></i>Bắt đầu</button>
                </form>
                <form th:if="${workOrder.status.name() == 'IN_PROGRESS'}" th:action="@{/workorders/{id}/pause(id=${workOrder.id})}" method="post">
                    <button type="submit" class="btn btn-outline-warning btn-sm"><i class="bi bi-pause-fill me-1"></i>Tạm dừng</button>
                </form>
                <form th:if="${workOrder.status.name() == 'PAUSED'}" th:action="@{/workorders/{id}/resume(id=${workOrder.id})}" method="post">
                    <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-play-fill me-1"></i>Tiếp tục</button>
                </form>
                <form th:if="${workOrder.status.name() == 'IN_PROGRESS' or workOrder.status.name() == 'PAUSED'}"
                      th:action="@{/workorders/{id}/complete(id=${workOrder.id})}" method="post">
                    <button type="submit" class="btn btn-success btn-sm"><i class="bi bi-check-lg me-1"></i>Hoàn thành</button>
                </form>
                <a th:if="${workOrder.status.name() == 'COMPLETED'}" th:href="@{/inspections/create(workOrderId=${workOrder.id})}"
                   class="btn btn-success btn-sm"><i class="bi bi-patch-check me-1"></i>Nghiệm thu</a>
                <form th:if="${workOrder.status.active}" th:action="@{/workorders/{id}/cancel(id=${workOrder.id})}" method="post" data-confirm="Hủy phiếu công việc này?">
                    <button type="submit" class="btn btn-outline-danger btn-sm"><i class="bi bi-x-circle me-1"></i>Hủy</button>
                </form>
            </div>
        </div>

        <div class="alert alert-success alert-auto-dismiss alert-dismissible fade show" th:if="${success}" th:text="${success}"></div>

        <div class="card-section" style="max-width: 800px;">
            <div class="mb-3">
                <div class="progress progress-thin">
                    <div class="progress-bar" th:style="'width:' + ${workOrder.progressPercent} + '%'"></div>
                </div>
            </div>
            <table class="table table-borderless mb-0">
                <tr><th style="width:200px;">Nhà thầu</th><td><a th:href="@{/contractors/{id}(id=${workOrder.contractor.id})}" th:text="${workOrder.contractor.companyName}"></a></td></tr>
                <tr><th>Báo giá áp dụng</th><td th:text="${workOrder.quotation.quotationCode} + ' - ' + ${#numbers.formatDecimal(workOrder.quotation.totalAmount,0,'COMMA',0,'POINT')} + 'đ'"></td></tr>
                <tr><th>Ngày bắt đầu</th><td th:text="${#temporals.format(workOrder.startDate,'dd/MM/yyyy')}"></td></tr>
                <tr><th>Ngày dự kiến hoàn thành</th><td th:text="${#temporals.format(workOrder.expectedCompletionDate,'dd/MM/yyyy')}"></td></tr>
                <tr><th>Ngày hoàn thành thực tế</th><td th:text="${workOrder.actualCompletionDate != null ? #temporals.format(workOrder.actualCompletionDate,'dd/MM/yyyy') : '-'}"></td></tr>
                <tr><th>Nội dung công việc</th><td th:text="${workOrder.workDescription}"></td></tr>
                <tr><th>Kết quả</th><td th:text="${workOrder.result}"></td></tr>
                <tr><th>Bảo hành đến</th><td th:text="${workOrder.warrantyUntil != null ? #temporals.format(workOrder.warrantyUntil,'dd/MM/yyyy') : '-'}"></td></tr>
            </table>
        </div>
    </main>
</div>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
