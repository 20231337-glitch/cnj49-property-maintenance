<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="sidebar" class="sidebar" id="appSidebar">
    <div class="sidebar-brand">
        <i class="bi bi-buildings-fill"></i>
        <span>CNJ49</span>
    </div>
    <div class="sidebar-section">TỔNG QUAN</div>
    <a th:href="@{/dashboard}" class="sidebar-link"
       th:classappend="${currentUri == '/dashboard' or currentUri == '/'} ? 'active' : ''">
        <i class="bi bi-speedometer2"></i><span>Dashboard</span>
    </a>

    <div class="sidebar-section">TÀI SẢN</div>
    <a th:href="@{/properties}" class="sidebar-link"
       th:classappend="${#strings.startsWith(currentUri,'/properties')} ? 'active' : ''">
        <i class="bi bi-building"></i><span>Bất động sản</span>
    </a>
    <a th:href="@{/units}" class="sidebar-link"
       th:classappend="${#strings.startsWith(currentUri,'/units')} ? 'active' : ''">
        <i class="bi bi-door-open"></i><span>Căn / phòng</span>
    </a>

    <div class="sidebar-section">BẢO TRÌ</div>
    <a th:href="@{/maintenance}" class="sidebar-link"
       th:classappend="${#strings.startsWith(currentUri,'/maintenance')} ? 'active' : ''">
        <i class="bi bi-tools"></i><span>Yêu cầu bảo trì</span>
    </a>
    <a th:href="@{/workorders}" class="sidebar-link"
       th:classappend="${#strings.startsWith(currentUri,'/workorders')} ? 'active' : ''">
        <i class="bi bi-clipboard-check"></i><span>Phiếu công việc</span>
    </a>
    <a th:href="@{/inspections}" class="sidebar-link"
       th:classappend="${#strings.startsWith(currentUri,'/inspections')} ? 'active' : ''">
        <i class="bi bi-patch-check"></i><span>Nghiệm thu</span>
    </a>
    <a th:href="@{/categories}" class="sidebar-link"
       th:classappend="${#strings.startsWith(currentUri,'/categories')} ? 'active' : ''">
        <i class="bi bi-tags"></i><span>Hạng mục bảo trì</span>
    </a>

    <div class="sidebar-section">ĐỐI TÁC</div>
    <a th:href="@{/contractors}" class="sidebar-link"
       th:classappend="${#strings.startsWith(currentUri,'/contractors')} ? 'active' : ''">
        <i class="bi bi-person-badge"></i><span>Nhà thầu</span>
    </a>

    <div class="sidebar-section">TÀI CHÍNH</div>
    <a th:href="@{/expenses}" class="sidebar-link"
       th:classappend="${#strings.startsWith(currentUri,'/expenses')} ? 'active' : ''">
        <i class="bi bi-cash-coin"></i><span>Chi phí vận hành</span>
    </a>

    <div class="sidebar-section">PHÂN TÍCH</div>
    <a th:href="@{/reports}" class="sidebar-link"
       th:classappend="${#strings.startsWith(currentUri,'/reports')} ? 'active' : ''">
        <i class="bi bi-bar-chart-line"></i><span>Báo cáo</span>
    </a>
</nav>
</body>
</html>
