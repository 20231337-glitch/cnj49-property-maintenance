<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title=${unitForm.id} != null ? 'Sửa căn/phòng' : 'Thêm căn/phòng')}"></head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <h4 class="fw-bold mb-3" th:text="${unitForm.id} != null ? 'Sửa căn/phòng' : 'Thêm căn/phòng'"></h4>

        <div class="card-section" style="max-width: 700px;">
            <form th:action="${unitForm.id} != null ? @{/units/{id}(id=${unitForm.id})} : @{/units}"
                  th:object="${unitForm}" method="post">

                <div class="mb-3">
                    <label class="form-label form-required">Bất động sản</label>
                    <select class="form-select" th:field="*{propertyId}"
                            th:classappend="${#fields.hasErrors('propertyId')} ? 'is-invalid'">
                        <option value="">-- Chọn bất động sản --</option>
                        <option th:each="p : ${properties}" th:value="${p.id}" th:text="${p.name}"></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{propertyId}"></div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label form-required">Mã căn/phòng</label>
                        <input type="text" class="form-control" th:field="*{code}"
                               th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{code}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label form-required">Tên căn/phòng</label>
                        <input type="text" class="form-control" th:field="*{name}"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{name}"></div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label form-required">Tầng</label>
                        <input type="number" min="0" class="form-control" th:field="*{floorNumber}">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label form-required">Loại</label>
                        <select class="form-select" th:field="*{unitType}">
                            <option th:each="t : ${unitTypes}" th:value="${t}" th:text="${t.label}"></option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label form-required">Diện tích (m²)</label>
                        <input type="number" step="0.01" min="0" class="form-control" th:field="*{area}">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label form-required">Trạng thái</label>
                    <select class="form-select" th:field="*{status}">
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mô tả</label>
                    <textarea class="form-control" rows="3" th:field="*{description}"></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Lưu</button>
                <a th:href="@{/units}" class="btn btn-outline-secondary">Hủy</a>
            </form>
        </div>
    </main>
</div>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
