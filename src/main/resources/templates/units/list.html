<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Căn / phòng')}"></head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold mb-0">Căn / phòng</h4>
            <a th:href="@{/units/create}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Thêm mới</a>
        </div>

        <div class="alert alert-success alert-auto-dismiss alert-dismissible fade show" th:if="${success}" th:text="${success}"></div>

        <div class="card-section">
            <form method="get" th:action="@{/units}" class="row g-2 mb-3">
                <div class="col-md-3">
                    <input type="text" name="keyword" class="form-control" placeholder="Tìm theo tên, mã..." th:value="${keyword}">
                </div>
                <div class="col-md-2">
                    <select name="propertyId" class="form-select">
                        <option value="">-- Bất động sản --</option>
                        <option th:each="p : ${properties}" th:value="${p.id}" th:text="${p.name}" th:selected="${p.id == propertyId}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <select name="floorNumber" class="form-select">
                        <option value="">-- Tầng --</option>
                        <option th:each="f : ${floors}" th:value="${f}" th:text="'Tầng ' + ${f}" th:selected="${f == floorNumber}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <select name="unitType" class="form-select">
                        <option value="">-- Loại --</option>
                        <option th:each="t : ${unitTypes}" th:value="${t}" th:text="${t.label}" th:selected="${t == unitType}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <select name="status" class="form-select">
                        <option value="">-- Trạng thái --</option>
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}" th:selected="${s == status}"></option>
                    </select>
                </div>
                <div class="col-md-1">
                    <button type="submit" class="btn btn-outline-primary w-100"><i class="bi bi-search"></i></button>
                </div>
            </form>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                    <tr><th>Mã</th><th>Tên</th><th>Bất động sản</th><th>Tầng</th><th>Loại</th><th>Diện tích</th><th>Trạng thái</th><th></th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${units.content}">
                        <td th:text="${u.code}"></td>
                        <td><a th:href="@{/units/{id}(id=${u.id})}" th:text="${u.name}"></a></td>
                        <td th:text="${u.property.name}"></td>
                        <td th:text="${u.floorNumber}"></td>
                        <td th:text="${u.unitType.label}"></td>
                        <td th:text="${u.area} + ' m²'"></td>
                        <td><span th:replace="~{fragments/badges :: statusBadge(${u.status})}"></span></td>
                        <td class="text-end">
                            <a th:href="@{/units/{id}/edit(id=${u.id})}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/units/{id}/delete(id=${u.id})}" method="post" class="d-inline" data-confirm="Xóa căn/phòng này?">
                                <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${units.totalElements == 0}"><td colspan="8" class="text-center text-muted py-4">Không có dữ liệu</td></tr>
                    </tbody>
                </table>
            </div>

            <nav th:replace="~{fragments/pagination :: pagination(${units}, @{/units(keyword=${keyword},propertyId=${propertyId},floorNumber=${floorNumber},unitType=${unitType},status=${status})})}"></nav>
        </div>
    </main>
</div>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
