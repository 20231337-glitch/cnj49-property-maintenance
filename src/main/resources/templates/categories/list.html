<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Hạng mục bảo trì')}"></head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold mb-0">Hạng mục bảo trì</h4>
            <a th:href="@{/categories/create}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Thêm mới</a>
        </div>

        <div class="alert alert-success alert-auto-dismiss alert-dismissible fade show" th:if="${success}" th:text="${success}"></div>

        <div class="card-section">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead><tr><th>Tên hạng mục</th><th>Mô tả</th><th>Trạng thái</th><th></th></tr></thead>
                    <tbody>
                    <tr th:each="c : ${categories}">
                        <td th:text="${c.name}"></td>
                        <td th:text="${c.description}"></td>
                        <td>
                            <span th:if="${c.active}" class="badge text-bg-success">Đang sử dụng</span>
                            <span th:unless="${c.active}" class="badge text-bg-secondary">Ngừng sử dụng</span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{/categories/{id}/edit(id=${c.id})}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/categories/{id}/delete(id=${c.id})}" method="post" class="d-inline" data-confirm="Xóa hạng mục này?">
                                <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(categories)}"><td colspan="4" class="text-center text-muted py-4">Không có dữ liệu</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
