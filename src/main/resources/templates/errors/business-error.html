<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Không thể thực hiện thao tác</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="d-flex align-items-center justify-content-center vh-100 bg-light">
<div class="text-center" style="max-width: 520px;">
    <i class="bi bi-exclamation-triangle text-warning" style="font-size: 2.5rem;"></i>
    <h4 class="mt-3">Không thể thực hiện thao tác</h4>
    <p class="text-muted" th:text="${message}">Thông báo lỗi nghiệp vụ</p>
    <a th:href="${backUrl} ?: '/dashboard'" class="btn btn-primary mt-2">Quay lại</a>
</div>
</body>
</html>
