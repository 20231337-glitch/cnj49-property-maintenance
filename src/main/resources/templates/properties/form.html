<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title=${property.id} != null ? 'Sửa bất động sản' : 'Thêm bất động sản')}"></head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <h4 class="fw-bold mb-3" th:text="${property.id} != null ? 'Sửa bất động sản' : 'Thêm bất động sản'"></h4>

        <div class="card-section" style="max-width: 760px;">
            <form th:action="${property.id} != null ? @{/properties/{id}(id=${property.id})} : @{/properties}"
                  th:object="${property}" method="post">

                <div class="mb-3" th:if="${property.id} != null">
                    <label class="form-label">Mã bất động sản</label>
                    <input type="text" class="form-control" th:value="${property.code}" disabled>
                </div>

                <div class="mb-3">
                    <label class="form-label form-required">Tên bất động sản</label>
                    <input type="text" class="form-control" th:field="*{name}"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{name}"></div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label form-required">Loại bất động sản</label>
                        <select class="form-select" th:field="*{propertyType}"
                                th:classappend="${#fields.hasErrors('propertyType')} ? 'is-invalid'">
                            <option value="">-- Chọn loại --</option>
                            <option th:each="t : ${propertyTypes}" th:value="${t}" th:text="${t.label}"></option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{propertyType}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label form-required">Trạng thái</label>
                        <select class="form-select" th:field="*{status}">
                            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}"></option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label form-required">Địa chỉ</label>
                    <input type="text" class="form-control" th:field="*{address}"
                           th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{address}"></div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label form-required">Số tầng</label>
                        <input type="number" min="0" class="form-control" th:field="*{numberOfFloors}"
                               th:classappend="${#fields.hasErrors('numberOfFloors')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{numberOfFloors}"></div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label form-required">Số căn/phòng</label>
                        <input type="number" min="0" class="form-control" th:field="*{numberOfUnits}"
                               th:classappend="${#fields.hasErrors('numberOfUnits')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{numberOfUnits}"></div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label form-required">Diện tích (m²)</label>
                        <input type="number" step="0.01" min="0" class="form-control" th:field="*{area}"
                               th:classappend="${#fields.hasErrors('area')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{area}"></div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Ngày đưa vào vận hành</label>
                    <input type="date" class="form-control" th:field="*{operationDate}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Mô tả</label>
                    <textarea class="form-control" rows="3" th:field="*{description}"></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Lưu</button>
                <a th:href="@{/properties}" class="btn btn-outline-secondary">Hủy</a>
            </form>
        </div>
    </main>
</div>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
