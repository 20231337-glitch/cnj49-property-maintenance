spring.application.name=cnj49-property-maintenance

# ===== DATABASE (MySQL 8.x) =====
spring.datasource.url=jdbc:mysql://localhost:3306/cnj49_property_maintenance?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / HIBERNATE =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Bat Open Session In View: nhieu trang Thymeleaf hien thi truc tiep cac quan he LAZY
# (vi du unit.property.name) nen can session con mo trong luc render view.
spring.jpa.open-in-view=true

# ===== THYMELEAF =====
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ===== WEB =====
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.mvc.problemdetails.enabled=false
spring.web.resources.add-mappings=true

# Cho phep @ControllerAdvice xu ly 404 thay vi trang Whitelabel
spring.mvc.throw-exception-if-no-handler-found=true
server.error.whitelabel.enabled=false

# ===== SEED DATA =====
# Chi seed khi database chua co du lieu (idempotent)
app.seed.enabled=true

# ===== LOGGING =====
logging.level.org.springframework=INFO
logging.level.com.cnj49=INFO
